name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/text-fit-audit.mjs
      - run: npm run build

  # Workstream 3 of the UX/QA fix pass (docs/CROSS_PLATFORM_TESTING.md): device-emulation smoke
  # suite against the dev server (iPhone 12/14, Pixel 7, generic 360x740 Android — see
  # playwright.config.ts), plus a lighter check against the actual built dist/ (manifest, service
  # worker, offline reload — playwright.dist.config.ts). Separate job from build-and-test so a
  # flaky browser-automation failure doesn't block on/gate the fast unit-test feedback above.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - run: npx playwright test --config=playwright.dist.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
