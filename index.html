<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2B3A55" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- Relative, matching vite.config's base: './' — the same portability choice src/core/assets.ts
     documents (dev server + static build today; a Capacitor file://-scheme WebView tomorrow). -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tour Life: International Dates</title>
<meta name="description" content="A cozy rhythm-adventure about an indie band's world tour — pick a route, live the story between shows, play every gig, end with a one-of-a-kind Tour Scrapbook. No hard fails." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Tour Life: International Dates" />
<meta property="og:description" content="A cozy rhythm-adventure about an indie band's world tour — pick a route, live the story between shows, play every gig, end with a one-of-a-kind Tour Scrapbook." />
<!-- Absolute, unlike the rest of this file's relative './' links (vite.config's base, for
     Capacitor file:// portability) — the OG/Twitter spec requires an absolute image URL, and most
     real-world scrapers (Slack, Discord, iMessage) don't reliably resolve a relative one. -->
<meta property="og:image" content="https://tour-life-v3.vercel.app/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Tour Life: International Dates" />
<meta name="twitter:description" content="A cozy rhythm-adventure about an indie band's world tour. No hard fails — every choice just makes a different story." />
<meta name="twitter:image" content="https://tour-life-v3.vercel.app/og-image.png" />
<!-- Real painted title background (public/assets/manifest.json) — BootScene loads it after this,
     so preloading here means it's already in the HTTP cache by the time Title's own load.image
     call for "bg_title" runs, instead of that being the first request for it. -->
<link rel="preload" as="image" href="./assets/img/bg_title.webp" />
<style>
  /* Self-hosted, no CDN hotlink. Variable fonts — a single file covers the weight range. */
  @font-face {
    font-family: 'Baloo 2';
    font-style: normal;
    font-weight: 600 800;
    font-display: block;
    src: url('/fonts/Baloo2-Variable.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400 700;
    font-display: block;
    src: url('/fonts/Nunito-Variable.woff2') format('woff2');
  }
  html, body { margin: 0; padding: 0; background: #2B3A55; overflow: hidden; height: 100%; width: 100%; }
  /* #app IS the safe area: pinned inside the notch and home-indicator insets, with no padding.
     Phaser's Scale.FIT measures its parent with getBoundingClientRect(), which includes padding,
     so the earlier padded 100vh box made Phaser size the canvas to the WHOLE screen and it spilled
     under the notch and home indicator on iPhones. Fixed positioning also avoids 100vh, which on
     iOS Safari is the height behind the toolbar, not the height you can see. */
  #app {
    position: fixed;
    top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
    display: flex; align-items: center; justify-content: center;
  }
  /* QA round 2 #3: Tour Life is a portrait game. On a phone turned sideways the whole canvas fit
     into ~230 CSS px of width and nothing was readable. Phones in landscape get a rotate prompt
     instead (the Android build locks portrait in its manifest, so this is the browser case). */
  #rotate-prompt {
    display: none; position: fixed; inset: 0; z-index: 2000; background: #2B3A55; color: #F5EBDD;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
    font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; font-size: 18px; padding: 24px;
  }
  #rotate-prompt .icon { font-size: 44px; line-height: 1; transform: rotate(90deg); }
  /* QA round 4 #2: any touch screen held sideways, not only short ones (a big phone or a foldable
     in landscape is over 500 px tall and showed a tiny, squeezed game). Keep in step with
     ROTATE_QUERY in src/main.ts, which pauses a running show while this is up. */
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 900px) { #rotate-prompt { display: flex; } }
  canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="rotate-prompt" role="alert"><div class="icon">&#x1F4F1;</div><div>Tour Life plays upright.</div><div style="font-weight:400;font-size:15px;opacity:.85">Turn your phone to portrait to keep playing. Your tour is right where you left it.</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
