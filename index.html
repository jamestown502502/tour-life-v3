<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2B3A55" />
<title>Tour Life: International Dates</title>
<style>
  /* Self-hosted, no CDN hotlink. Variable fonts — a single file covers the weight range. */
  @font-face {
    font-family: 'Baloo 2';
    font-style: normal;
    font-weight: 600 800;
    font-display: block;
    src: url('/fonts/Baloo2-Variable.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 400 700;
    font-display: block;
    src: url('/fonts/Nunito-Variable.woff2') format('woff2');
  }
  html, body { margin: 0; padding: 0; background: #2B3A55; overflow: hidden; height: 100%; width: 100%; }
  #app {
    width: 100vw; height: 100vh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    display: flex; align-items: center; justify-content: center;
  }
  canvas { touch-action: none; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
